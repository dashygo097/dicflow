[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dicflow"
version = "0.1.0"
description = "Retargetable hardware workflows with locked Bender dependencies"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
dicflow = "dicflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"dicflow.backends" = ["*/*.tcl"]
